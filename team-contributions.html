<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIA — Team Contributions</title><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="kia-shell.css"><script type="module" src="js/auth-guard.js"></script></head><body><div data-kia-shell><header class="kia-page-header"><div><p class="kia-eyebrow">WORKSPACE</p><h1>Team Contributions</h1><p>Track assigned work, project activity, and the tasks currently moving through your workspace.</p></div><div class="kia-header-actions"><a class="kia-button" href="workspace.html">Open workspace</a></div></header><section class="kia-grid" id="stats"></section><section class="kia-panel" style="padding:20px;margin-top:12px"><div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><h2 style="margin:0 0 5px">My work</h2><p style="margin:0;color:var(--kia-muted)">Tasks assigned to your staff profile.</p></div><select id="status-filter" class="kia-button"><option value="all">All statuses</option><option value="todo">To do</option><option value="in_progress">In progress</option><option value="done">Done</option></select></div></section><div id="contributions" class="kia-grid" style="margin-top:12px"></div><div id="empty" class="kia-empty" hidden>No assigned work matches this filter.</div></div><script type="module" src="js/kia-shell.js"></script><script type="module" src="js/team-contributions.js"></script></body></html>
