<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log in — KAI</title>

    <link rel="stylesheet" href="login.css">
<style>.kai-mark{display:block;width:1em;height:1em}.logo-icon .kai-mark{width:22px;height:22px}.orb-core .kai-mark,.feature-icon .kai-mark{width:1em;height:1em}</style>
</head>

<body>

    <div class="background">
        <div class="blur blur-one"></div>
        <div class="blur blur-two"></div>
        <div class="blur blur-three"></div>
    </div>

    <main class="auth-page">

        <a href="home.html" class="logo">
            <span class="logo-icon"><svg class="kai-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M9 7V25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M23 7L10 16L23 25" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="8" r="2" fill="currentColor"/></svg></span>
            <span>KAI</span>
        </a>

        <section class="auth-card">

            <div class="auth-header">

                <h1>Welcome back</h1>

                <p>
                    Log in to continue to KAI.
                </p>

            </div>


            <form class="auth-form">

                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <div class="password-label">

                        <label for="password">Password</label>

                        <a href="#">Forgot password?</a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="submit-btn">
                    Log in
                    <span>→</span>
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <button
                id="google-login"
                class="social-btn"
            >
                <span>G</span>
                Continue with Google
            </button>


            <p class="switch-auth">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

        </section>


        <p class="terms">
            By continuing, you agree to our
            <a href="#">Terms</a> and
            <a href="#">Privacy Policy</a>.
        </p>

    </main>
    <script type="module" src="js/login.js"></script>
</body>
</html>
