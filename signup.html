<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create account — KAI</title>

    <link rel="stylesheet" href="signup.css">
<style>.kai-mark{display:block;width:1em;height:1em}.logo-icon .kai-mark{width:22px;height:22px}.orb-core .kai-mark,.feature-icon .kai-mark{width:1em;height:1em}</style>
</head>

<body>

    <div class="background">
        <div class="blur blur-one"></div>
        <div class="blur blur-two"></div>
        <div class="blur blur-three"></div>
    </div>

    <main class="auth-page">

        <a href="home.html" class="logo">
            <span class="logo-icon"><svg class="kai-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M9 7V25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M23 7L10 16L23 25" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="8" r="2" fill="currentColor"/></svg></span>
            <span>KAI</span>
        </a>


        <section class="auth-card">

            <div class="auth-header">

                <h1>Create your account</h1>

                <p>
                    Start exploring KAI today.
                </p>

            </div>


            <form class="auth-form">

                <div class="form-group">

                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button type="submit" class="submit-btn">

                    Create account

                    <span>→</span>

                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <button id="google-signup" class="social-btn">

                <span>G</span>

                Continue with Google

            </button>


            <p class="switch-auth">

                Already have an account?

                <a href="login.html">Log in</a>

            </p>

        </section>


        <p class="terms">

            By creating an account, you agree to our

            <a href="#">Terms</a>

            and

            <a href="#">Privacy Policy</a>.

        </p>

    </main>
    <script type="module" src="js/signup.js"></script>
</body>
</html>
