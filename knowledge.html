<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIA — Knowledge</title><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="kia-shell.css"><script type="module" src="js/auth-guard.js"></script></head><body><div data-kia-shell><header class="kia-page-header"><div><p class="kia-eyebrow">KNOWLEDGE</p><h1>Company knowledge</h1><p>Store approved guidance, SOPs, policies and project knowledge for authorized KIA use.</p></div><div class="kia-header-actions"><button id="new-doc" class="kia-button primary">Add knowledge</button></div></header><section class="kia-page-header" style="margin-bottom:18px"><div><h2 style="margin:0;font-size:20px">Knowledge documents</h2><p style="margin-top:6px">Only authorized staff can access project-scoped knowledge.</p></div></section><div id="docs" class="kia-grid"></div><div id="empty" class="kia-empty">No knowledge documents yet.</div></div><dialog id="dialog" class="modal"><form id="form" method="dialog"><button type="button" class="modal-close" id="close">×</button><p class="eyebrow">KNOWLEDGE</p><h2>Add knowledge</h2><label>Title<input name="title" required maxlength="200"></label><label>Type<select name="document_type"><option value="knowledge">Knowledge</option><option value="sop">SOP</option><option value="policy">Policy</option><option value="guide">Guide</option></select></label><label>Description<textarea name="description" rows="2"></textarea></label><label>Content<textarea name="content" rows="10" required placeholder="Paste approved company knowledge here..."></textarea></label><div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary">Save knowledge</button></div></form></dialog><script type="module" src="js/kia-shell.js"></script><script type="module" src="js/knowledge.js"></script></body></html>
