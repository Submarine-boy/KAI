<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIA Knowledge</title><link rel="stylesheet" href="workspace.css"><script type="module" src="js/auth-guard.js"></script></head><body><main class="workspace-main" style="margin:40px;max-width:1100px"><header class="topbar"><div><p class="eyebrow">KIA KNOWLEDGE</p><h1>Company knowledge</h1><p>Store approved guidance, SOPs, policies and project knowledge for authorized KIA use.</p></div><a class="primary link-button" href="workspace.html">← Workspace</a></header><section class="section-toolbar"><div><h2>Knowledge documents</h2><p>Only authorized staff can access project-scoped knowledge.</p></div><button id="new-doc" class="primary">Add knowledge</button></section><div id="docs" class="project-grid"></div><div id="empty" class="empty">No knowledge documents yet.</div></main><dialog id="dialog" class="modal"><form id="form" method="dialog"><button type="button" class="modal-close" id="close">×</button><p class="eyebrow">KNOWLEDGE</p><h2>Add knowledge</h2><label>Title<input name="title" required maxlength="200"></label><label>Type<select name="document_type"><option value="knowledge">Knowledge</option><option value="sop">SOP</option><option value="policy">Policy</option><option value="guide">Guide</option></select></label><label>Description<textarea name="description" rows="2"></textarea></label><label>Content<textarea name="content" rows="10" required placeholder="Paste approved company knowledge here..."></textarea></label><div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary">Save knowledge</button></div></form></dialog><script type="module" src="js/knowledge.js"></script></body></html>
