<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI</title>
    <link rel="stylesheet" href="nova.css">
    <style>
        .kai-mark { display:block; width:22px; height:22px; }
        .logo-icon .kai-mark { width:23px; height:23px; }
        .welcome-icon .kai-mark { width:38px; height:38px; }
        .kai-plan-mark { display:flex; align-items:center; justify-content:center; }
        .kai-plan-mark .kai-mark { width:18px; height:18px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>marked.setOptions({ gfm: true, breaks: true });</script>
    <script type="module" src="js/auth-guard.js"></script>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-header">
                <a href="index.html" class="logo"><span class="logo-icon"><svg class="kai-mark" viewBox="0 0 32 32" fill="none"><path d="M9 7V25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M23 7L10 16L23 25" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="8" r="2" fill="currentColor"/></svg></span><span>KAI</span></a>
                <button class="close-sidebar" aria-label="Close sidebar">×</button>
            </div>
            <button class="new-chat"><span class="new-chat-icon">+</span><span>New chat</span></button>
            <button class="search-button"><span>⌕</span><span>Search chats</span><kbd>⌘ K</kbd></button>
        </div>
        <div class="chat-history"></div>
        <div class="sidebar-bottom">
            <button class="user-profile" type="button"><div class="avatar">U</div><div class="user-details"><strong>User</strong><span>Free plan</span></div><span class="profile-menu">⋯</span></button>
            <div class="account-popup"><div class="account-popup-header"><div class="account-avatar">U</div><div class="account-info"><strong class="account-name">User</strong><span class="account-email">user@example.com</span></div></div><div class="account-popup-divider"></div><div class="account-plan"><span class="kai-plan-mark">K</span><div><strong>Free plan</strong><small>Current plan</small></div></div><div class="account-popup-divider"></div><button class="logout-button" type="button"><span>↪</span>Log out</button></div>
        </div>
    </aside>
    <main class="main">
        <section class="chat-area">
            <div class="welcome">
                <div class="welcome-icon"><svg class="kai-mark" viewBox="0 0 32 32" fill="none"><path d="M9 7V25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M23 7L10 16L23 25" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="8" r="2" fill="currentColor"/></svg></div>
                <h1>How can I help you?</h1><p>Ask KAI anything. Explore ideas, solve problems, learn, create, and more.</p>
                <div class="suggestions"><button class="suggestion"><span class="suggestion-icon">?</span><div><strong>Explain something</strong><small>Help me understand a difficult concept</small></div></button><button class="suggestion"><span class="suggestion-icon">⌘</span><div><strong>Write some code</strong><small>Help me build or debug a project</small></div></button><button class="suggestion"><span class="suggestion-icon">✎</span><div><strong>Help me write</strong><small>Create or improve something</small></div></button><button class="suggestion"><span class="suggestion-icon">◈</span><div><strong>Brainstorm ideas</strong><small>Explore possibilities together</small></div></button></div>
            </div>
            <div class="composer-container">
                <form class="composer">
                    <input type="file" id="image-input" accept="image/*" hidden>
                    <div id="image-preview" class="image-preview" hidden><img id="image-preview-img" alt="Selected image"><button type="button" id="remove-image" aria-label="Remove image">×</button></div>
                    <button type="button" class="attach-button" title="Attach image" aria-label="Attach image">+</button>
                    <textarea id="message-input" placeholder="Message KAI..." rows="1"></textarea>
                    <div class="composer-actions"><button type="button" class="voice-button" title="Voice" aria-label="Voice"><svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z"/><path d="M18 11a6 6 0 0 1-12 0"/><path d="M12 17v4"/><path d="M9 21h6"/></svg></button><button type="submit" class="send-button" title="Send" aria-label="Send"><span class="send-icon">↑</span></button></div>
                </form>
                <p class="composer-disclaimer">KAI can make mistakes. Check important information.</p>
            </div>
        </section>
    </main>
</div>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/attachments.js"></script>
</body>
</html>
